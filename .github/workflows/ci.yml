name: Build and test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore OpenDisplayNet.slnx

      - name: Build
        run: dotnet build OpenDisplayNet.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test OpenDisplayNet.slnx --configuration Release --no-build
